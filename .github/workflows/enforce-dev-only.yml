name: Enforce dev-only PRs to main

on:
  pull_request:
    branches: [main]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Block PRs not from dev
        if: github.head_ref != 'dev'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ PRs to `main` must come from the `dev` branch only.\n\nPlease merge your changes into `dev` first, then open a PR from `dev` → `main`.'
            })
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            })
            core.setFailed('PR source must be dev branch.')
