name: Protect main branch

on:
  pull_request:
    branches: [main]

jobs:
  enforce-dev-only:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Close PR if not from dev
        if: github.head_ref != 'dev'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚫 PRs to \`main\` are only accepted from the \`dev\` branch.\n\nPlease open your PR against \`dev\` instead. Once reviewed and merged there, a maintainer will promote \`dev\` → \`main\`.\n\nSee [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for the full workflow.`
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });
